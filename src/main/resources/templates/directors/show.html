<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title th:text="'SiwFestival - ' + ${director.fullName}">Regista</title>
	<link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
	<div th:replace="~{fragments/header :: header}"></div>
	<main class="contenitore">
		<h1 th:text="${director.fullName}">Regista</h1>

		<div class="blocco">
			<p>
				<strong>Nazionalita':</strong> <span th:text="${director.nationality}">nazionalita'</span><br />
				<strong>Data di nascita:</strong> <span th:text="${#temporals.format(director.dateOfBirth, 'dd/MM/yyyy')}">data</span>
			</p>
			<div class="azioni" th:if="${isAdmin}">
				<a th:href="@{'/admin/directors/' + ${director.id} + '/edit'}">Modifica regista</a>
			</div>
		</div>

		<div class="blocco">
			<h2>Filmografia</h2>
			<div th:if="${movies.isEmpty()}">Nessun film nel sistema</div>
			<ul class="elenco">
				<li th:each="movie : ${movies.content}">
					<a th:href="@{'/movies/' + ${movie.id}}" th:text="${movie.title + ' (' + movie.year + ')'}">film</a>
				</li>
			</ul>
			<div th:replace="~{fragments/paginazione :: paginazione(${movies}, '/directors/' + ${director.id} + '?', 'page')}"></div>
		</div>
	</main>
</body>
</html>
