spring.application.name=festivalcinema
spring.datasource.url=jdbc:postgresql://localhost:5432/festivalcinema
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html

spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8

logging.level.root=INFO
logging.level.it.uniroma3.siw.festivalcinema=DEBUG

# locandine cartella sul disco esposta su /uploads/**
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
