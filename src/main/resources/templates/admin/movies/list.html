<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>SiwFestival - Film</title>
	<link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
	<div th:replace="~{fragments/header :: header}"></div>
	<main class="contenitore">
		<div class="testata">
			<h1 th:if="${festival != null}" th:text="'Film in programma a ' + ${festival.name} + ' ' + ${festival.year}">Film</h1>
			<h1 th:if="${festival == null}">Film</h1>
			<a class="bottone" th:if="${isAdmin}" href="/admin/movies/new">Aggiungi un film</a>
		</div>
		<p th:if="${festival != null}"><a th:href="@{'/festivals/' + ${festival.id}}">Torna al festival</a></p>

		<div class="blocco">
			<form class="modulo-inline" th:if="${festival == null}" th:action="@{/movies}" method="GET">
				<div class="campo">
					<label>Titolo</label>
					<input type="text" name="title" th:value="${title}" />
				</div>
				<div class="campo">
					<label>Genere</label>
					<input type="text" name="genre" th:value="${genre}" />
				</div>
				<button type="submit">Cerca</button>
			</form>

			<div th:if="${movies.isEmpty()}">Nessun film trovato</div>
			<table class="lista" th:unless="${movies.isEmpty()}">
				<thead>
					<tr>
						<th>Titolo</th><th>Anno</th><th>Regista</th><th>Genere</th><th>Durata</th><th th:if="${isAdmin}"></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="movie : ${movies.content}">
						<td><a th:href="@{'/movies/' + ${movie.id}}" th:text="${movie.title}">titolo</a></td>
						<td th:text="${movie.year}">anno</td>
						<td><a th:href="@{'/directors/' + ${movie.director.id}}" th:text="${movie.director.fullName}">regista</a></td>
						<td th:text="${movie.genre}">genere</td>
						<td th:text="${movie.duration + ' min'}">durata</td>
						<td th:if="${isAdmin}"><a th:href="@{'/admin/movies/' + ${movie.id} + '/edit'}">Modifica</a></td>
					</tr>
				</tbody>
			</table>

			<div th:replace="~{fragments/paginazione :: paginazione(${movies}, ${festival != null}
				? '/festivals/' + ${festival.id} + '/movies?'
				: '/movies?title=' + ${#uris.escapeQueryParam(title != null ? title : '')} + '&amp;genre=' + ${#uris.escapeQueryParam(genre != null ? genre : '')} + '&amp;', 'page')}"></div>
		</div>
	</main>
</body>
</html>
