<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:fragment="header" class="intestazione">
		<div class="intestazione-riga">
			<div class="intestazione-sx"></div>
			<div class="intestazione-logo">
				<a href="/"><img src="/images/logo.png" alt="Festival Cinematografici" /></a>
			</div>
			<div class="intestazione-dx">
				<div class="utente" th:if="${userDetails}">
					<span class="nome-utente">
						<img class="icona-utente" th:src="@{/images/utente.svg}" alt="" />
						<span th:text="${userDetails.username}">utente</span>
					</span>
					<form th:action="@{/logout}" method="POST">
						<button type="submit" class="bottone-secondario bottone-piccolo">Logout</button>
					</form>
				</div>
				<div class="utente" th:unless="${userDetails}">
					<a href="/login">Login</a>
					<a href="/register">Registrati</a>
				</div>
			</div>
		</div>
		<nav class="navigazione">
			<a href="/festivals">Festival</a>
			<a href="/movies">Film</a>
			<a href="/directors">Registi</a>
			<a th:if="${userDetails}" href="/reviews">Le mie recensioni</a>
			<a th:if="${isAdmin}" href="/admin/index">Amministrazione</a>
		</nav>
	</div>
</body>
</html>
